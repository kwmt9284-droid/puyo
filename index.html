<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぷよぷよ風パズル</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 18% 12%,rgba(255,255,255,.95) 0 5%,transparent 18%),
      radial-gradient(circle at 82% 18%,rgba(255,236,168,.75) 0 6%,transparent 22%),
      linear-gradient(180deg,#42b7ff 0%,#97e2ff 42%,#e8f8ff 70%,#ffe99a 100%);
    color:#18324a; user-select:none; touch-action:manipulation; overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;opacity:.55}
  body::before{width:260px;height:260px;left:-70px;bottom:8%;background:radial-gradient(circle,#ffffffaa 0 20%,transparent 65%)}
  body::after{width:340px;height:340px;right:-110px;top:10%;background:radial-gradient(circle,#fff7cbaa 0 18%,transparent 68%)}
  .wrap{width:min(96vw,760px); padding:14px}
  h1{margin:0 0 8px;text-align:center;font-size:clamp(24px,5vw,42px);color:#ff4b75;text-shadow:0 2px #fff}
  .game{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start}
  .boardbox{
    position:relative; margin:auto; padding:12px; border-radius:26px;
    background:linear-gradient(155deg,#4f9ff0 0%,#2467b8 42%,#0a3c78 100%);
    border:2px solid rgba(255,255,255,.78);
    box-shadow:0 18px 40px rgba(0,38,92,.35),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -16px 30px rgba(1,22,67,.42);
  }
  canvas{display:block;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.82),transparent 35%),linear-gradient(180deg,#cdefff 0%,#edfaff 65%,#d5f0ff 100%);border-radius:16px;max-width:100%;height:auto;box-shadow:inset 0 0 30px rgba(41,136,204,.18),0 2px 0 rgba(255,255,255,.6)}
  .side{display:flex;flex-direction:column;gap:10px}
  .panel{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(239,249,255,.9));border:2px solid rgba(255,255,255,.95);border-radius:20px;padding:12px;box-shadow:0 9px 22px rgba(26,73,128,.18),inset 0 0 0 1px rgba(67,139,203,.10)}
  .label{font-size:12px;font-weight:900;letter-spacing:.12em;color:#4a7195}
  .value{font-size:29px;font-weight:1000;color:#163f6b;text-shadow:0 1px #fff}
  .nextWrap{display:flex;align-items:center;justify-content:center;min-height:98px}
  #next{width:90px;height:90px}
  button{
    border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:12px 10px;font-size:16px;font-weight:900;
    background:linear-gradient(180deg,#ffe97a,#ffc72f);color:#513800;
    box-shadow:0 5px 0 #d79a00,0 8px 16px rgba(91,57,0,.18),inset 0 1px 0 #fff;cursor:pointer
  }
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d79a00}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .controls button{font-size:24px;padding:13px 4px}
  .controls .wide{grid-column:span 3;font-size:18px;background:#6ae08a;box-shadow:0 4px 0 #2aa24e;margin-top:18px}
  .help{font-size:12px;line-height:1.5}
  .overlay{
    position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;
    background:#0b2c55cc;border-radius:12px;color:white;text-align:center;padding:20px;
  }
  .overlay.hidden{display:none}
  .overlay h2{font-size:34px;margin:0 0 8px}
  .chain{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);
    font-size:42px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #ff4b75,0 0 12px #003;
    pointer-events:none;opacity:0;transition:.15s;
  }
  .chain.show{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  .clearfx{
    position:absolute;inset:10px;pointer-events:none;overflow:hidden;border-radius:12px;
  }
  .spark{
    position:absolute;width:10px;height:10px;border-radius:50%;
    animation:burst 1.2s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(.5);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.8);opacity:0}
  }

  @media(max-width:650px){
    body{align-items:flex-start;overflow:hidden}
    .wrap{
      padding:4px 8px 6px;
      height:100svh;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    h1{font-size:24px;margin:0 0 3px;line-height:1.05}
    .game{
      grid-template-columns:1fr;
      gap:4px;
      flex:1;
      min-height:0;
    }
    .boardbox{
      padding:6px;
      border-radius:14px;
      max-height:calc(100svh - 185px);
    }
    #game{
      width:auto;
      height:calc(100svh - 200px);
      max-height:600px;
      aspect-ratio:1/2;
      margin:auto;
    }
    .controls{
      gap:5px;
      margin-top:5px;
    }
    .controls button{
      font-size:22px;
      padding:8px 4px;
      min-height:44px;
    }
    .controls .wide{
      margin-top:18px;
      font-size:16px;
      padding:8px 4px;
    }
    .side{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:4px;
    }
    .side .panel{padding:5px 8px;border-radius:12px}
    .side .panel:nth-child(5),
    .side .panel:nth-child(6){display:none}
    .label{font-size:11px}
    .value{font-size:18px;line-height:1.1}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ぷよぷよ風パズル</h1>
  <div class="game">
    <div>
      <div class="boardbox">
        <canvas id="game" width="300" height="600"></canvas>
        <div id="chainText" class="chain"></div>
        <div id="clearfx" class="clearfx"></div>
        <div id="overlay" class="overlay">
          <div>
            <h2>ぷよぷよ風</h2>
            <p>同じ色を4個以上つなげて消そう！</p>
            <button id="startBtn">ゲームスタート</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="left">◀</button>
        <button id="rotate">⟳</button>
        <button id="right">▶</button>
        <button id="down" class="wide">▼ すばやく落とす</button>
      </div>
    </div>
    <div class="side">
      <div class="panel">
        <div class="label">SCORE</div><div id="score" class="value">0</div>
      </div>
      <div class="panel">
        <div class="label">LEVEL</div><div id="level" class="value">1</div>
      </div>
      <div class="panel">
        <div class="label">TARGET</div><div id="target" class="value">20</div>
      </div>
      <div class="panel">
        <div class="label">CHAIN</div><div id="best" class="value">0</div>
      </div>
      <div class="panel">
        <div class="label">NEXT</div>
        <div class="nextWrap"><canvas id="next" width="100" height="100"></canvas></div>
      </div>
      <div class="panel help">
        PC：← → 移動 / ↑ 回転 / ↓ 落下 / Space 一気に落下<br>
        スマホ：下のボタンで操作
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const COLS=6, ROWS=12, CELL=50;
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const nextCanvas=document.getElementById('next'), nctx=nextCanvas.getContext('2d');
  const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
  const levelEl=document.getElementById('level'), targetEl=document.getElementById('target');
  const overlay=document.getElementById('overlay'), startBtn=document.getElementById('startBtn');
  const chainText=document.getElementById('chainText'), clearfx=document.getElementById('clearfx');
  const COLORS=['#ff4d67','#44c767','#4d79ff','#ffd43b','#a96cff'];
  let board, pair, nextPair, score=0, bestChain=0, running=false, resolving=false;
  let last=0, dropTimer=0, dropInterval=700;
  let level=1, clearedThisLevel=0;
  const TARGETS=[20,25,30,35,40,45,50,55,60];

  function emptyBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }
  function randColor(){ return Math.floor(Math.random()*COLORS.length); }
  function makePair(){ return {a:randColor(),b:randColor()}; }

  function spawn(){
    pair={x:2,y:0,dir:0,a:nextPair.a,b:nextPair.b};
    nextPair=makePair();
    drawNext();
    if(!canPlace(pair.x,pair.y,pair.dir)){ gameOver(); }
  }
  function cellsOf(x,y,dir){
    let dx=0,dy=-1;
    if(dir===1){dx=1;dy=0}
    if(dir===2){dx=0;dy=1}
    if(dir===3){dx=-1;dy=0}
    return [{x,y,c:pair.a},{x:x+dx,y:y+dy,c:pair.b}];
  }
  function canPlace(x,y,dir){
    for(const p of cellsOf(x,y,dir)){
      if(p.x<0||p.x>=COLS||p.y>=ROWS) return false;
      if(p.y>=0 && board[p.y][p.x]!=null) return false;
    }
    return true;
  }
  function move(dx,dy){
    if(!running||resolving) return false;
    if(canPlace(pair.x+dx,pair.y+dy,pair.dir)){ pair.x+=dx;pair.y+=dy; return true; }
    return false;
  }
  function rotate(){
    if(!running||resolving) return;
    const nd=(pair.dir+1)%4;
    if(canPlace(pair.x,pair.y,nd)){pair.dir=nd;return}
    if(canPlace(pair.x-1,pair.y,nd)){pair.x--;pair.dir=nd;return}
    if(canPlace(pair.x+1,pair.y,nd)){pair.x++;pair.dir=nd;return}
    if(canPlace(pair.x,pair.y-1,nd)){pair.y--;pair.dir=nd}
  }
  function hardDrop(){
    if(!running||resolving)return;
    let n=0; while(move(0,1)) n++;
    score+=n; updateUI(); lock();
  }
  function lock(){
    if(resolving)return;
    resolving=true;
    const cs=cellsOf(pair.x,pair.y,pair.dir);
    for(const p of cs){
      if(p.y<0){ gameOver(); return; }
      board[p.y][p.x]=p.c;
    }
    resolveChains(1);
  }

  function findGroups(){
    const seen=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    const remove=[];
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(board[y][x]==null||seen[y][x])continue;
      const color=board[y][x], q=[[x,y]], group=[]; seen[y][x]=true;
      while(q.length){
        const [cx,cy]=q.pop(); group.push([cx,cy]);
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=cx+dx,ny=cy+dy;
          if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!seen[ny][nx]&&board[ny][nx]===color){
            seen[ny][nx]=true;q.push([nx,ny]);
          }
        }
      }
      if(group.length>=4) remove.push(...group);
    }
    return remove;
  }
  function gravity(){
    for(let x=0;x<COLS;x++){
      let write=ROWS-1;
      for(let y=ROWS-1;y>=0;y--){
        if(board[y][x]!=null){
          const v=board[y][x]; board[y][x]=null; board[write][x]=v; write--;
        }
      }
    }
  }
  async function resolveChains(chain){
    const rem=findGroups();
    if(!rem.length){
      if(clearedThisLevel>=TARGETS[level-1]){
        await levelClear();
        return;
      }
      resolving=false; spawn(); return;
    }
    const uniq=[...new Set(rem.map(([x,y])=>x+','+y))].map(s=>s.split(',').map(Number));
    score += uniq.length * 10 * chain;
    clearedThisLevel += uniq.length;
    bestChain=Math.max(bestChain,chain); updateUI(); showChain(chain);
    for(const [x,y] of uniq) board[y][x]=null;
    await sleep(220);
    gravity();
    await sleep(220);
    resolveChains(chain+1);
  }
  async function levelClear(){
    resolving=true;
    if(level>=9){
      await gameClear();
      return;
    }
    overlay.innerHTML=`<div><h2>LEVEL ${level} CLEAR!</h2><p>次の面へ！</p></div>`;
    overlay.classList.remove('hidden');
    playTone('level');
    await sleep(900);
    level++;
    clearedThisLevel=0;
    dropInterval=Math.max(260,700-(level-1)*55);
    startBGM();
    board=emptyBoard();
    overlay.classList.add('hidden');
    updateUI();
    resolving=false;
    spawn();
  }

  async function gameClear(){
    running=false; resolving=true;
    stopBGM();
    board=emptyBoard(); draw();
    playTone('clear');
    makeClearFX();
    overlay.innerHTML=`<div><h2 style="font-size:48px">GAME CLEAR!</h2><p>9面クリア！ おめでとう！</p><button id="again">もう一度遊ぶ</button></div>`;
    overlay.classList.remove('hidden');
    document.getElementById('again').onclick=()=>start();
  }

  function makeClearFX(){
    clearfx.innerHTML='';
    const cols=['#ff4d67','#44c767','#4d79ff','#ffd43b','#a96cff','#ffffff'];
    for(let i=0;i<90;i++){
      const s=document.createElement('div');
      s.className='spark';
      s.style.left=(50+Math.random()*10-5)+'%';
      s.style.top=(45+Math.random()*10-5)+'%';
      s.style.background=cols[Math.floor(Math.random()*cols.length)];
      s.style.setProperty('--dx',(Math.random()*500-250)+'px');
      s.style.setProperty('--dy',(Math.random()*700-350)+'px');
      s.style.animationDelay=(Math.random()*.35)+'s';
      clearfx.appendChild(s);
    }
    setTimeout(()=>clearfx.innerHTML='',1700);
  }

  function playTone(type){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=new AC();
      const notes=type==='clear' ? [523,659,784,1047,784,1047,1319] : [523,659,784,1047];
      notes.forEach((f,i)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(.0001,ac.currentTime+i*.12);
        g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+i*.12+.02);
        g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.12+.18);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime+i*.12); o.stop(ac.currentTime+i*.12+.2);
      });
    }catch(e){}
  }


  let bgmCtx=null,bgmTimer=null,bgmStep=0;
  function ensureAudio(){
    if(!bgmCtx){const AC=window.AudioContext||window.webkitAudioContext;bgmCtx=new AC();}
    if(bgmCtx.state==='suspended') bgmCtx.resume();
  }
  function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}bgmStep=0;}
  function startBGM(){
    try{
      ensureAudio();stopBGM();
      const melody=[523,659,784,659,698,784,880,784,659,587,659,784,523,659,587,494];
      const bass=[131,131,147,147,165,165,147,147];
      const stepMs=Math.max(125,220-(level-1)*9);
      const beat=()=>{
        if(!running)return;
        const now=bgmCtx.currentTime;
        const o=bgmCtx.createOscillator(),g=bgmCtx.createGain();
        o.type='square';o.frequency.value=melody[bgmStep%melody.length];
        g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.035,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.14);
        o.connect(g);g.connect(bgmCtx.destination);o.start(now);o.stop(now+.16);
        if(bgmStep%2===0){
          const bo=bgmCtx.createOscillator(),bg=bgmCtx.createGain();
          bo.type='triangle';bo.frequency.value=bass[(bgmStep/2)%bass.length];
          bg.gain.setValueAtTime(.0001,now);bg.gain.exponentialRampToValueAtTime(.022,now+.01);bg.gain.exponentialRampToValueAtTime(.0001,now+.18);
          bo.connect(bg);bg.connect(bgmCtx.destination);bo.start(now);bo.stop(now+.20);
        }
        bgmStep++;
      };
      beat();bgmTimer=setInterval(beat,stepMs);
    }catch(e){}
  }

  function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
  function showChain(n){
    chainText.textContent=n===1?'1 CHAIN!':n+' CHAIN!!';
    chainText.classList.add('show');
    setTimeout(()=>chainText.classList.remove('show'),500);
  }

  function drawPuyo(g,x,y,color,r=CELL*.42){
    g.save(); g.translate(x,y);
    g.fillStyle='rgba(1,33,78,.18)';
    g.beginPath(); g.ellipse(2,r*.78,r*.70,r*.22,0,0,Math.PI*2); g.fill();

    const body=g.createRadialGradient(-r*.38,-r*.48,r*.05,r*.10,r*.12,r*1.20);
    body.addColorStop(0,'#fff'); body.addColorStop(.08,color); body.addColorStop(.62,color); body.addColorStop(1,'#102d4b');
    g.fillStyle=body;
    g.beginPath();
    g.moveTo(0,-r);
    g.bezierCurveTo(r*.72,-r*.98,r*1.02,-r*.46,r*.96,r*.12);
    g.bezierCurveTo(r*.92,r*.73,r*.52,r*1.03,0,r*.98);
    g.bezierCurveTo(-r*.54,r*1.03,-r*.94,r*.76,-r*.97,r*.12);
    g.bezierCurveTo(-r*1.01,-r*.49,-r*.70,-r*.98,0,-r);
    g.closePath(); g.fill();

    g.strokeStyle='rgba(255,255,255,.68)'; g.lineWidth=Math.max(1.6,r*.075); g.stroke();

    g.fillStyle='rgba(255,255,255,.72)';
    g.beginPath(); g.ellipse(-r*.36,-r*.48,r*.18,r*.31,-.55,0,Math.PI*2); g.fill();

    const eyeY=-r*.12;
    for(const ex of [-r*.19,r*.19]){
      g.fillStyle='#fff'; g.beginPath(); g.ellipse(ex,eyeY,r*.16,r*.19,0,0,Math.PI*2); g.fill();
      g.fillStyle='#1a2940'; g.beginPath(); g.arc(ex+(ex<0?r*.025:-r*.025),eyeY+r*.015,r*.075,0,Math.PI*2); g.fill();
      g.fillStyle='#fff'; g.beginPath(); g.arc(ex-r*.025,eyeY-r*.03,r*.025,0,Math.PI*2); g.fill();
    }
    g.strokeStyle='rgba(46,29,54,.55)'; g.lineWidth=Math.max(1.2,r*.045); g.lineCap='round';
    g.beginPath(); g.arc(0,r*.18,r*.16,.15,Math.PI-.15); g.stroke();
    g.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#ffffff66';ctx.lineWidth=1;
    for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,ROWS*CELL);ctx.stroke()}
    for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(COLS*CELL,y*CELL);ctx.stroke()}
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(board[y][x]!=null) drawPuyo(ctx,x*CELL+CELL/2,y*CELL+CELL/2,COLORS[board[y][x]]);
    }
    if(running && pair && !resolving){
      for(const p of cellsOf(pair.x,pair.y,pair.dir)){
        if(p.y>=0) drawPuyo(ctx,p.x*CELL+CELL/2,p.y*CELL+CELL/2,COLORS[p.c]);
      }
    }
  }
  function drawNext(){
    nctx.clearRect(0,0,100,100);
    drawPuyo(nctx,50,30,COLORS[nextPair.b],20);
    drawPuyo(nctx,50,70,COLORS[nextPair.a],20);
  }
  function updateUI(){
    scoreEl.textContent=score;
    bestEl.textContent=bestChain;
    levelEl.textContent=level;
    targetEl.textContent=Math.max(0,TARGETS[level-1]-clearedThisLevel);
  }

  function tick(t){
    const dt=t-last;last=t;
    if(running&&!resolving){
      dropTimer+=dt;
      if(dropTimer>=dropInterval){
        dropTimer=0;
        if(!move(0,1)) lock();
      }
    }
    draw(); requestAnimationFrame(tick);
  }
  function start(){
    board=emptyBoard();score=0;bestChain=0;dropTimer=0;dropInterval=700;
    level=1;clearedThisLevel=0;
    clearfx.innerHTML='';
    nextPair=makePair();running=true;resolving=false;overlay.classList.add('hidden');updateUI();spawn();
    startBGM();
  }
  function gameOver(){
    running=false;resolving=false;
    stopBGM();
    overlay.innerHTML=`<div><h2>ゲームオーバー</h2><p>スコア：${score}</p><button id="again">もう一度遊ぶ</button></div>`;
    overlay.classList.remove('hidden');
    document.getElementById('again').onclick=()=>{ overlay.innerHTML='<div><h2>ぷよぷよ風</h2><p>同じ色を4個以上つなげて消そう！</p></div>'; start(); };
  }

  document.addEventListener('keydown',e=>{
    if(!running)return;
    if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(e.code))e.preventDefault();
    if(e.code==='ArrowLeft')move(-1,0);
    if(e.code==='ArrowRight')move(1,0);
    if(e.code==='ArrowDown'){if(move(0,1)){score++;updateUI()}else lock()}
    if(e.code==='ArrowUp')rotate();
    if(e.code==='Space')hardDrop();
  });
  const press=(id,fn)=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}
  press('left',()=>move(-1,0)); press('right',()=>move(1,0)); press('rotate',rotate); press('down',hardDrop);
  startBtn.onclick=start;

  board=emptyBoard(); nextPair=makePair(); drawNext(); updateUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
